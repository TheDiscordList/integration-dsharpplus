name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Tag matches the csproj version
        run: |
          version=$(dotnet msbuild src/TheDiscordList.DSharpPlus -getProperty:Version)
          if [ "$version" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match csproj version $version"
            exit 1
          fi
      - run: dotnet test -c Release
      - run: dotnet pack src/TheDiscordList.DSharpPlus -c Release -o artifacts -p:Version="$VERSION"
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
